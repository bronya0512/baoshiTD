services:
  baoshitd:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: baoshitd
    ports:
      - "8080:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    # 可选：挂载日志目录
    # volumes:
    #   - ./logs:/app/logs

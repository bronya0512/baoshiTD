<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>八字TD - API 控制台</title>
    <link rel="stylesheet" href="/web/css/style.css">
</head>
<body>
    <header class="header">
        <div class="container">
            <h1>🔮 八字TD</h1>
            <p class="subtitle">基于 OpenSpec 模式的 Go API 骨架</p>
        </div>
    </header>

    <main class="container main">
        <!-- 健康检查 -->
        <section class="card">
            <h2>💓 系统状态</h2>
            <div id="health-status" class="status">
                <span class="status-dot"></span>
                <span>检查中...</span>
            </div>
            <button class="btn btn-primary" onclick="checkHealth()">重新检查</button>
        </section>

        <!-- API 文档入口 -->
        <section class="card">
            <h2>📖 API 文档</h2>
            <div class="link-group">
                <a href="/docs/" class="btn btn-outline" target="_blank">Swagger UI</a>
                <a href="/openapi.yaml" class="btn btn-outline" target="_blank">OpenAPI Spec</a>
            </div>
        </section>

        <!-- 用户管理 -->
        <section class="card">
            <h2>👥 用户管理</h2>

            <div class="form-group">
                <h3>创建用户</h3>
                <form id="create-form" onsubmit="createUser(event)">
                    <input type="text" id="user-name" placeholder="姓名" required>
                    <input type="email" id="user-email" placeholder="邮箱" required>
                    <button type="submit" class="btn btn-primary">创建</button>
                </form>
            </div>

            <div class="form-group">
                <h3>查询用户</h3>
                <div class="inline-form">
                    <input type="number" id="query-id" placeholder="用户ID" min="1">
                    <button class="btn btn-secondary" onclick="getUser()">查询</button>
                </div>
                <div id="query-result" class="result"></div>
            </div>

            <div>
                <h3>用户列表</h3>
                <button class="btn btn-primary" onclick="listUsers()">刷新列表</button>
                <div id="user-list" class="user-list"></div>
            </div>
        </section>

        <!-- 实时响应 -->
        <section class="card">
            <h2>📡 最近响应</h2>
            <pre id="recent-response" class="response-display">无请求</pre>
        </section>
    </main>

    <footer class="footer">
        <p>© 2026 八字TD · Go + Gin + OpenSpec</p>
    </footer>

    <script src="/web/js/app.js"></script>
</body>
</html>
